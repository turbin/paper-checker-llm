# 定义请求限制区域，限制最大队列为4个请求
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    # 全局连接数限制，限制每个IP最多4个并发连接
    limit_conn conn_limit_per_ip 4;
    # 全局请求速率限制，限制每个IP每秒1个请求，最大突发请求数为4
    limit_req zone=req_limit_per_ip burst=4 nodelay;

    # 前端静态文件
    location / {
        root /app/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api {
        # API专用连接限制
        limit_conn conn_limit_per_ip 4;
        
        proxy_pass http://localhost:5300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 设置队列超时
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        
        # 处理429错误
        error_page 429 /too_many_requests.html;
    }

    # 429错误页面
    location = /too_many_requests.html {
        root /app/frontend/public;
        internal;
    }

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
} 