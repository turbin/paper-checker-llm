# 移除user指令，使用默认用户
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # 定义请求限制区域，限制最大队列为4个请求
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
    limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=1r/s;

    # 设置客户端请求体的最大值为 100M
    client_max_body_size 100M;

    # 确保只有一个默认 server
    server {
        listen 8087 default_server;
        server_name _;

        # 全局连接数限制，限制每个IP最多4个并发连接
        limit_conn conn_limit_per_ip 4;
        # 全局请求速率限制，限制每个IP每秒1个请求，最大突发请求数为4
        limit_req zone=req_limit_per_ip burst=4 nodelay;

        # 前端静态文件
        location / {
            root /app/frontend/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 后端 API
        location /api {
            # API专用连接限制
            limit_conn conn_limit_per_ip 4;
            
            proxy_pass http://localhost:5300;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 设置队列超时
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            
            # 增加缓冲区大小
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            
            # 处理429错误
            error_page 429 /too_many_requests.html;
        }

        # 429错误页面
        location = /too_many_requests.html {
            root /app/frontend/public;
            internal;
        }

        # 日志配置
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
} 